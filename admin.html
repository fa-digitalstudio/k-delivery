<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Admin - Kelola Pesanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --utama: #0F4C5C;
            --hijau: #22C55E;
            --kuning: #F59E0B;
            --biru: #3B82F6;
            --abu: #6B7280;
            --abu-terang: #F3F4F6;
            --putih: #FFFFFF;
            --teks: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--abu-terang);
            color: var(--teks);
            padding-bottom: 85px;
        }

        .header {
            background-color: var(--utama);
            color: white;
            padding: 1.2rem;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0.1);
        }

        .container {
            padding: 1rem;
            max-width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 576px) { .container { max-width: 540px; } }
        @media (min-width: 768px) { .container { max-width: 720px; } }
        @media (min-width: 992px) { .container { max-width: 960px; } }
        @media (min-width: 1200px) { .container { max-width: 1140px; } }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .card h5 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--utama);
        }

        .pesanan-item {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
            white-space: nowrap;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-bawah {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            padding: 0.8rem 0;
            z-index: 99;
            flex-wrap: wrap;
        }

        .nav-item {
            text-align: center;
            color: var(--abu);
            font-size: 0.85rem;
            cursor: pointer;
            flex: 1;
            padding: 5px 0;
        }

        .nav-item.aktif {
            color: var(--utama);
            font-weight: 500;
        }

        .nav-item i {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.2rem;
        }

        .halaman { display: none; }
        .halaman.aktif { display: block; }

        .kosong {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--abu);
        }

        .kosong i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .info-sinkron {
            font-size: 0.8rem;
            color: #6B7280;
            text-align: right;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="judulHalaman">Panel Admin</h1>
</div>

<div class="container">
    <!-- Halaman Daftar Pesanan -->
    <div class="halaman aktif" id="halaman-pesanan">
        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5><i class="bi bi-receipt-cutoff"></i> Semua Data Pesanan</h5>
                <span class="info-sinkron" id="statusSinkronPesanan"></span>
            </div>
            <div id="daftarSemuaPesanan"></div>
        </div>
    </div>

    <!-- Halaman Kelola Menu & Kategori -->
    <div class="halaman" id="halaman-menu">
        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5><i class="bi bi-egg-fried"></i> Kelola Menu Makanan</h5>
                <span class="info-sinkron" id="statusSinkronMenu"></span>
            </div>
            <div class="mb-3 d-flex flex-wrap gap-2">
                <input type="text" id="namaMenu" class="form-control" placeholder="Nama Menu">
                <input type="number" id="hargaMenu" class="form-control" placeholder="Harga">
                <input type="text" id="gambarMenu" class="form-control" placeholder="Link Gambar">
                <select id="kategoriMenu" class="form-select"></select>
                <button onclick="tambahMenu()" class="btn btn-success">Simpan Menu</button>
            </div>
            <div id="daftarMenuAdmin"></div>
        </div>

        <div class="card mt-3">
            <h5><i class="bi bi-list-ul"></i> Kelola Kategori</h5>
            <div class="mb-3 d-flex flex-wrap gap-2">
                <input type="text" id="namaKategori" class="form-control" placeholder="Nama Kategori">
                <button onclick="tambahKategori()" class="btn btn-success">Tambah Kategori</button>
            </div>
            <div id="daftarKategoriAdmin"></div>
        </div>
    </div>

    <!-- Halaman Kelola Data Driver -->
    <div class="halaman" id="halaman-driver">
        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5><i class="bi bi-person-badge"></i> Kelola Data Driver</h5>
                <span class="info-sinkron" id="statusSinkronDriver"></span>
            </div>
            <div class="mb-3 d-flex flex-wrap gap-2">
                <input type="text" id="namaDriverBaru" class="form-control" placeholder="Nama Lengkap Driver" style="flex: 1 1 220px;">
                <input type="tel" id="hpDriverBaru" class="form-control" placeholder="Nomor HP Aktif" style="flex: 1 1 200px;">
                <button onclick="tambahDriver()" class="btn btn-success">Tambah Driver</button>
            </div>
            <div id="daftarDriverKelola"></div>
        </div>
    </div>

    <!-- Halaman Kelola Pelanggan (Baru) -->
    <div class="halaman" id="halaman-pelanggan">
        <div class="card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5><i class="bi bi-people-fill"></i> Kelola Pelanggan</h5>
                <span class="info-sinkron" id="statusSinkronPelanggan"></span>
            </div>
            <div id="wadahDaftarPelanggan"></div>
        </div>
    </div>

    <!-- Halaman Kelola Banner -->
    <div class="halaman" id="halaman-banner">
        <div class="card">
            <h5><i class="bi bi-image"></i> Kelola Banner Promo</h5>
            <div class="mb-3">
                <input type="text" id="linkBanner" class="form-control" placeholder="Masukkan link gambar banner">
                <button onclick="simpanBanner()" class="btn btn-success w-100 mt-2">Simpan Banner</button>
            </div>
            <div id="tampilanBanner"></div>
        </div>
    </div>

    <!-- Pengaturan Sistem -->
    <div class="halaman" id="halaman-pengaturan">
        <div class="card">
            <h5><i class="bi bi-gear-fill"></i> Pengaturan Sistem</h5>
            <div class="mb-3">
                <label class="form-label text-muted fw-bold">Minimal Ongkir (0 - 1 KM Pertama) (Rp)</label>
                <input type="number" id="inputOngkirMinimal" class="form-control" placeholder="Contoh: 5000">
            </div>
            <div class="mb-3">
                <label class="form-label text-muted fw-bold">Tambahan Tarif per Kilometer (Rp)</label>
                <input type="number" id="inputOngkirKm" class="form-control" placeholder="Contoh: 2000">
            </div>
            <button onclick="simpanPengaturan()" class="btn btn-success w-100 fw-bold">Simpan Pengaturan</button>
        </div>
    </div>
</div>

<!-- Navigasi Bawah -->
<div class="nav-bawah">
    <div class="nav-item aktif" onclick="bukaHalamanAdmin('pesanan')">
        <i class="bi bi-receipt-cutoff"></i>
        <span>Pesanan</span>
    </div>
    <div class="nav-item" onclick="bukaHalamanAdmin('menu')">
        <i class="bi bi-egg-fried"></i>
        <span>Menu</span>
    </div>
    <div class="nav-item" onclick="bukaHalamanAdmin('driver')">
        <i class="bi bi-person-badge"></i>
        <span>Driver</span>
    </div>
    <div class="nav-item" onclick="bukaHalamanAdmin('pelanggan')">
        <i class="bi bi-people-fill"></i>
        <span>Pelanggan</span>
    </div>
    <div class="nav-item" onclick="bukaHalamanAdmin('banner')">
        <i class="bi bi-image"></i>
        <span>Banner</span>
    </div>
    <div class="nav-item" onclick="bukaHalamanAdmin('pengaturan')">
        <i class="bi bi-gear-fill"></i>
        <span>Seting</span>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhVNZpZsHFB5xD-jp17RtjiV6Su3yftmI",
  authDomain: "dok123-1bd6f.firebaseapp.com",
  databaseURL: "https://dok123-1bd6f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dok123-1bd6f",
  storageBucket: "dok123-1bd6f.firebasestorage.app",
  messagingSenderId: "664523539322",
  appId: "1:664523539322:web:61c0adedc67fee015dccc3"
};
    
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refData = db.ref("data");

let daftarMenu = [];
let daftarKategori = [];
let daftarDriver = [];
let daftarPesanan = [];
let daftarBanner = [];
let daftarPengguna = [];
let pengaturanSistem = { ongkirMinimal: 5000, ongkirPerKm: 2000 };

async function bacaDariPenyimpanan() {
    try {
        const snapshot = await refData.once("value");
        const konten = snapshot.val() || {};

        daftarMenu = konten.daftarMenu || [];
        daftarKategori = konten.daftarKategori || [];
        daftarDriver = konten.daftarDriver || [];
        daftarPesanan = konten.daftarPesanan || [];
        daftarBanner = konten.daftarBanner || [];
        daftarPengguna = konten.daftarPengguna || [];
        pengaturanSistem = konten.pengaturan || { ongkirMinimal: 5000, ongkirPerKm: 2000 };

        const inpOngkirMin = document.getElementById("inputOngkirMinimal");
        const inpOngkirKm = document.getElementById("inputOngkirKm");
        if(inpOngkirMin && document.activeElement !== inpOngkirMin) inpOngkirMin.value = pengaturanSistem.ongkirMinimal;
        if(inpOngkirKm && document.activeElement !== inpOngkirKm) inpOngkirKm.value = pengaturanSistem.ongkirPerKm;

        console.log("✅ Data berhasil dimuat dari Firebase");
    } catch (err) {
        console.warn("⚠️ Tidak dapat membaca dari Firebase:", err);
    }
}

async function simpanKePenyimpanan() {
    try {
        const dataUntukSimpan = {
            daftarMenu,
            daftarKategori,
            daftarDriver,
            daftarPesanan,
            daftarBanner,
            daftarPengguna,
            pengaturan: pengaturanSistem,
            diperbaruiPada: new Date().toISOString()
        };

        await refData.set(dataUntukSimpan);
        console.log("✅ Data berhasil disimpan ke Firebase");
        return true;
    } catch (err) {
        console.error("❌ Gagal menyimpan ke Firebase:", err);
        alert("Gagal menyimpan data: " + err.message);
        return false;
    }
}

function bukaHalamanAdmin(nama) {
    document.querySelectorAll(".halaman").forEach(h => h.classList.remove("aktif"));
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("aktif"));

    if (nama === "pesanan") {
        document.getElementById("halaman-pesanan").classList.add("aktif");
        document.querySelector(".nav-item:nth-child(1)").classList.add("aktif");
        document.getElementById("judulHalaman").textContent = "Daftar Semua Pesanan";
        tampilkanSemuaPesanan();
    } else if (nama === "menu") {
        document.getElementById("halaman-menu").classList.add("aktif");
        document.querySelector(".nav-item:nth-child(2)").classList.add("aktif");
        document.getElementById("judulHalaman").textContent = "Kelola Menu & Kategori";
        tampilkanKategoriDiPilihan();
        tampilkanDaftarMenuAdmin();
        tampilkanDaftarKategoriAdmin();
    } else if (nama === "driver") {
        document.getElementById("halaman-driver").classList.add("aktif");
        document.querySelector(".nav-item:nth-child(3)").classList.add("aktif");
        document.getElementById("judulHalaman").textContent = "Kelola Data Driver";
        tampilkanDaftarDriver();
    } else if (nama === "pelanggan") {
        document.getElementById("halaman-pelanggan").classList.add("aktif");
        document.querySelector(".nav-item:nth-child(4)").classList.add("aktif");
        document.getElementById("judulHalaman").textContent = "Kelola Pelanggan";
        tampilkanPelanggan();
    } else if (nama === "banner") {
        document.getElementById("halaman-banner").classList.add("aktif");
        document.querySelector(".nav-item:nth-child(5)").classList.add("aktif");
        document.getElementById("judulHalaman").textContent = "Kelola Banner";
        tampilkanBannerSaatIni();
    } else if (nama === "pengaturan") {
        document.getElementById("halaman-pengaturan").classList.add("aktif");
        document.querySelector(".nav-item:nth-child(6)").classList.add("aktif");
        document.getElementById("judulHalaman").textContent = "Pengaturan Sistem";
    }
}

function tampilkanSemuaPesanan() {
    const wadah = document.getElementById("daftarSemuaPesanan");
    document.getElementById("statusSinkronPesanan").textContent = `Terakhir diperbarui: ${new Date().toLocaleTimeString('id-ID')}`;

    if (daftarPesanan.length === 0) {
        wadah.innerHTML = `<div class="kosong"><i class="bi bi-inbox"></i><p>Belum ada pesanan masuk</p></div>`;
        return;
    }

    wadah.innerHTML = "";
    daftarPesanan.reverse().forEach((pes) => {
        let warnaStatus, teksStatus;
        if (pes.status === "Menunggu") { warnaStatus = "#6B7280"; teksStatus = "Menunggu"; }
        else if (pes.status === "Sudah Diambil") { warnaStatus = "#22C55E"; teksStatus = "Sudah Diambil"; }
        else if (pes.status === "Sampai di Restoran") { warnaStatus = "#3B82F6"; teksStatus = "Sampai di Restoran"; }
        else if (pes.status === "Dalam Perjalanan") { warnaStatus = "#F59E0B"; teksStatus = "Dalam Perjalanan"; }
        else if (pes.status === "Selesai") { warnaStatus = "#0F4C5C"; teksStatus = "Selesai"; }
        else if (pes.status === "Dibatalkan") { warnaStatus = "#DC2626"; teksStatus = "Dibatalkan"; }

        const infoOngkir = pes.ongkir !== undefined ? `<p class="mb-1"><strong>Ongkir:</strong> Rp ${pes.ongkir.toLocaleString('id-ID')} (${pes.jarak || 0} km)</p>` : '';
        const infoTotal = pes.totalBayar !== undefined ? `<p class="mb-1"><strong>Total Bayar:</strong> Rp ${pes.totalBayar.toLocaleString('id-ID')}</p>` : '';

        const infoPelanggan = `
            <p class="mb-1"><strong>Nama Pelanggan:</strong> ${pes.nama || '-'}</p>
            <p class="mb-1"><strong>Nomor HP:</strong> ${pes.hp || '-'}</p>
            <p class="mb-1"><strong>Alamat Lengkap:</strong> ${pes.alamat || '-'}</p>
            <p class="mb-1"><strong>Catatan:</strong> ${pes.catatan || 'Tidak ada catatan'}</p>
        `;

        const infoDriver = pes.namaDriver 
            ? `<p class="mb-1"><strong>Driver:</strong> ${pes.namaDriver} | HP: ${pes.idDriver}</p>` 
            : `<p class="mb-1"><strong>Driver:</strong> Belum ada yang mengambil</p>`;

        wadah.innerHTML += `
        <div class="pesanan-item">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
                <span class="fw-bold text-primary">ID TRANSAKSI: ${pes.resi}</span>
                <span class="status-badge" style="background: ${warnaStatus}">${teksStatus}</span>
            </div>

            <p class="mb-1"><strong>Pesanan:</strong> ${pes.barang || '-'}</p>
            ${infoOngkir}
            ${infoTotal}
            <hr class="my-2">
            ${infoPelanggan}
            ${infoDriver}
            <p class="mb-2 small text-muted"><strong>Waktu Pesan:</strong> ${pes.waktuPesan || '-'}</p>

            <div class="d-flex flex-wrap gap-2">
                <button onclick="ubahStatus('${pes.resi}', 'Sampai di Restoran')" class="btn btn-sm btn-primary">Di Restoran</button>
                <button onclick="ubahStatus('${pes.resi}', 'Dalam Perjalanan')" class="btn btn-sm btn-warning">Perjalanan</button>
                <button onclick="ubahStatus('${pes.resi}', 'Selesai')" class="btn btn-sm btn-success">Selesai</button>
                <button onclick="ubahStatus('${pes.resi}', 'Dibatalkan')" class="btn btn-sm btn-danger">Batalkan</button>
                <button onclick="hapusPesanan('${pes.resi}')" class="btn btn-sm btn-outline-danger">Hapus</button>
            </div>
        </div>`;
    });
}

async function simpanPengaturan() {
    pengaturanSistem.ongkirMinimal = parseInt(document.getElementById("inputOngkirMinimal").value) || 5000;
    pengaturanSistem.ongkirPerKm = parseInt(document.getElementById("inputOngkirKm").value) || 2000;
    if (await simpanKePenyimpanan()) {
        alert("✅ Pengaturan Tarif Ongkir Berhasil Disimpan!");
    }
}

async function ubahStatus(resi, statusBaru) {
    const indeks = daftarPesanan.findIndex(p => p.resi === resi);
    if (indeks !== -1) {
        if(statusBaru === 'Dibatalkan') {
            if(!confirm("Yakin ingin membatalkan pesanan ini?")) return;
        }
        daftarPesanan[indeks].status = statusBaru;
        if (await simpanKePenyimpanan()) tampilkanSemuaPesanan();
    }
}

async function hapusPesanan(resi) {
    if (!confirm("Yakin ingin menghapus pesanan ini?")) return;
    daftarPesanan = daftarPesanan.filter(p => p.resi !== resi);
    if (await simpanKePenyimpanan()) tampilkanSemuaPesanan();
}

async function tambahDriver() {
    const nama = document.getElementById("namaDriverBaru").value.trim();
    const hp = document.getElementById("hpDriverBaru").value.trim();

    if (!nama || !hp) {
        alert("Isi nama dan nomor HP terlebih dahulu!");
        return;
    }
    if (hp.length < 10 || hp.length > 14) {
        alert("Nomor HP tidak valid!");
        return;
    }

    const cekSudahAda = daftarDriver.find(d => d.hp === hp);
    if (cekSudahAda) {
        alert("Nomor HP ini sudah terdaftar sebagai driver!");
        return;
    }

    daftarDriver.push({
        nama: nama,
        hp: hp,
        status: "Aktif",
        waktuDaftar: new Date().toLocaleString('id-ID')
    });

    if (await simpanKePenyimpanan()) {
        document.getElementById("namaDriverBaru").value = "";
        document.getElementById("hpDriverBaru").value = "";
        tampilkanDaftarDriver();
        alert("Driver berhasil ditambahkan!");
    }
}

function tampilkanDaftarDriver() {
    const wadah = document.getElementById("daftarDriverKelola");
    document.getElementById("statusSinkronDriver").textContent = `Terakhir diperbarui: ${new Date().toLocaleTimeString('id-ID')}`;

    if (daftarDriver.length === 0) {
        wadah.innerHTML = `<p class="text-muted text-center py-3">Belum ada data driver yang ditambahkan</p>`;
        return;
    }

    wadah.innerHTML = `<div class="table-responsive">
        <table class="table table-striped table-hover w-100">
            <thead>
                <tr>
                    <th>Nama Lengkap</th>
                    <th>Nomor HP</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>`;

    daftarDriver.forEach((driver, indeks) => {
        let warnaBadge = "bg-secondary";
        if (driver.status === "Aktif") warnaBadge = "bg-success";
        else if (driver.status === "Diblokir") warnaBadge = "bg-danger";

        let tombolAksi = "";
        if (driver.status !== "Diblokir") {
            tombolAksi = `<button onclick="blokirDriver(${indeks})" class="btn btn-sm btn-outline-danger me-1">Blokir</button>`;
        } else {
            tombolAksi = `<button onclick="bukaBlokirDriver(${indeks})" class="btn btn-sm btn-outline-success me-1">Buka Blokir</button>`;
        }

        wadah.innerHTML += `
            <tr>
                <td>${driver.nama}</td>
                <td>${driver.hp}</td>
                <td><span class="badge ${warnaBadge}">${driver.status}</span></td>
                <td>
                    ${tombolAksi}
                    <button onclick="hapusDriver(${indeks})" class="btn btn-sm btn-outline-dark">Hapus</button>
                </td>
            </tr>`;
    });

    wadah.innerHTML += `</tbody></table></div>`;
}

async function blokirDriver(indeks) {
    if(!confirm("Yakin ingin memblokir driver ini? Driver yang diblokir tidak bisa menerima pesanan.")) return;
    daftarDriver[indeks].status = "Diblokir";
    if (await simpanKePenyimpanan()) tampilkanDaftarDriver();
}

async function bukaBlokirDriver(indeks) {
    daftarDriver[indeks].status = "Aktif";
    if (await simpanKePenyimpanan()) tampilkanDaftarDriver();
}

async function hapusDriver(indeks) {
    if (!confirm("Yakin ingin menghapus data driver ini secara permanen?")) return;
    daftarDriver.splice(indeks, 1);
    if (await simpanKePenyimpanan()) tampilkanDaftarDriver();
}

// FUNGSI BARU: Kelola Pelanggan
function tampilkanPelanggan() {
    const wadah = document.getElementById("wadahDaftarPelanggan");
    document.getElementById("statusSinkronPelanggan").textContent = `Terakhir diperbarui: ${new Date().toLocaleTimeString('id-ID')}`;

    if (daftarPengguna.length === 0) {
        wadah.innerHTML = `<div class="text-center py-4 text-muted">Belum ada pelanggan terdaftar.</div>`;
        return;
    }

    let html = "";
    daftarPengguna.forEach(p => {
        html += `
        <div class="pesanan-item p-3 mb-2 d-flex justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold m-0 text-dark">${p.nama}</h6>
                <p class="m-0 small text-muted"><i class="bi bi-telephone-fill"></i> ${p.hp}</p>
                <p class="m-0 small text-muted">Waktu Daftar: ${p.waktuDaftar || '-'}</p>
            </div>
            <button onclick="hapusPelanggan('${p.hp}')" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Hapus</button>
        </div>`;
    });
    wadah.innerHTML = html;
}

async function hapusPelanggan(hp) {
    if (!confirm("Peringatan: Yakin ingin menghapus akun pelanggan ini secara permanen?")) return;
    
    daftarPengguna = daftarPengguna.filter(p => p.hp !== hp);
    
    if (await simpanKePenyimpanan()) {
        alert("✅ Akun pelanggan berhasil dihapus");
        tampilkanPelanggan();
    }
}

function tampilkanKategoriDiPilihan() {
    const pilih = document.getElementById("kategoriMenu");
    pilih.innerHTML = "";
    daftarKategori.forEach((kat, i) => {
        pilih.innerHTML += `<option value="${i}">${kat.nama}</option>`;
    });
}

async function tambahKategori() {
    const nama = document.getElementById("namaKategori").value.trim();
    if (!nama) return alert("Nama kategori tidak boleh kosong!");
    daftarKategori.push({ id: Date.now(), nama: nama });
    if (await simpanKePenyimpanan()) {
        document.getElementById("namaKategori").value = "";
        tampilkanKategoriDiPilihan();
        tampilkanDaftarKategoriAdmin();
    }
}

function tampilkanDaftarKategoriAdmin() {
    const wadah = document.getElementById("daftarKategoriAdmin");
    if (daftarKategori.length === 0) {
        wadah.innerHTML = "<p class='text-muted'>Belum ada kategori</p>";
        return;
    }
    wadah.innerHTML = "";
    daftarKategori.forEach((kat, i) => {
        wadah.innerHTML += `<div class="d-flex justify-content-between align-items-center border p-2 rounded mb-2">
            <span>${kat.nama}</span>
            <button onclick="hapusKategori(${i})" class="btn btn-sm btn-outline-danger">Hapus</button>
        </div>`;
    });
}

async function hapusKategori(i) {
    if (!confirm("Yakin hapus kategori ini?")) return;
    daftarKategori.splice(i, 1);
    if (await simpanKePenyimpanan()) {
        tampilkanKategoriDiPilihan();
        tampilkanDaftarKategoriAdmin();
    }
}

async function tambahMenu() {
    const nama = document.getElementById("namaMenu").value.trim();
    const harga = document.getElementById("hargaMenu").value.trim();
    const gambar = document.getElementById("gambarMenu").value.trim();
    const idKat = document.getElementById("kategoriMenu").value;

    if (!nama || !harga || !gambar) return alert("Lengkapi semua data menu!");

    daftarMenu.push({
        id: Date.now(),
        nama: nama,
        harga: harga,
        gambar: gambar,
        idKategori: daftarKategori[idKat].id
    });

    if (await simpanKePenyimpanan()) {
        document.getElementById("namaMenu").value = "";
        document.getElementById("hargaMenu").value = "";
        document.getElementById("gambarMenu").value = "";
        tampilkanDaftarMenuAdmin();
    }
}

function tampilkanDaftarMenuAdmin() {
    const wadah = document.getElementById("daftarMenuAdmin");
    document.getElementById("statusSinkronMenu").textContent = `Terakhir diperbarui: ${new Date().toLocaleTimeString('id-ID')}`;

    if (daftarMenu.length === 0) {
        wadah.innerHTML = "<p class='text-muted'>Belum ada menu</p>";
        return;
    }
    wadah.innerHTML = "";
    daftarMenu.forEach((menu, i) => {
        const namaKat = daftarKategori.find(k => k.id === menu.idKategori)?.nama || "Lainnya";
        wadah.innerHTML += `<div class="border p-3 rounded mb-3">
            <div class="d-flex gap-3 align-items-center">
                <img src="${menu.gambar}" alt="${menu.nama}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 6px;">
                <div class="flex-grow-1">
                    <h6 class="mb-1">${menu.nama}</h6>
                    <p class="mb-1 text-success fw-bold">Rp ${Number(menu.harga).toLocaleString('id-ID')}</p>
                    <p class="mb-0 small text-muted">Kategori: ${namaKat}</p>
                </div>
                <button onclick="hapusMenu(${i})" class="btn btn-sm btn-outline-danger">Hapus</button>
            </div>
        </div>`;
    });
}

async function hapusMenu(i) {
    if (!confirm("Yakin hapus menu ini?")) return;
    daftarMenu.splice(i, 1);
    if (await simpanKePenyimpanan()) tampilkanDaftarMenuAdmin();
}

async function simpanBanner() {
    const link = document.getElementById("linkBanner").value.trim();
    if (!link) return alert("Masukkan link gambar banner!");
    daftarBanner = [{ link: link }];
    if (await simpanKePenyimpanan()) {
        tampilkanBannerSaatIni();
        alert("Banner berhasil disimpan!");
    }
}

function tampilkanBannerSaatIni() {
    const wadah = document.getElementById("tampilanBanner");
    if (daftarBanner.length > 0) {
        wadah.innerHTML = `<img src="${daftarBanner[0].link}" alt="Banner" style="width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-top: 1rem;">`;
    } else {
        wadah.innerHTML = `<p class="text-muted text-center py-3">Belum ada banner yang disimpan</p>`;
    }
}

window.onload = async function() {
    await bacaDariPenyimpanan();
    bukaHalamanAdmin('pesanan');
    setInterval(async () => {
        await bacaDariPenyimpanan();
        if (document.getElementById("halaman-pesanan").classList.contains("aktif")) tampilkanSemuaPesanan();
    }, 5000);
};
</script>
