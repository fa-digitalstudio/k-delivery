<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Pesan Makanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --utama: #0F4C5C;
            --hijau: #22C55E;
            --kuning: #F59E0B;
            --merah: #EF4444;
            --abu: #6B7280;
            --abu-terang: #F3F4F6;
            --putih: #FFFFFF;
            --teks: #111827;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--abu-terang);
            color: var(--teks);
            padding-bottom: 80px;
        }

        .header {
            background-color: var(--utama);
            color: white;
            padding: 1.2rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .container {
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .card h5 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        button {
            padding: 0.7rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-hijau { background: var(--hijau); color: white; }
        .btn-biru { background: var(--biru, #3B82F6); color: white; }
        .btn-kuning { background: var(--kuning); color: white; }
        .btn-merah { background: var(--merah); color: white; }
        .btn-abu { background: var(--abu); color: white; }

        .tabel {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .tabel th, .tabel td {
            padding: 0.8rem;
            border-bottom: 1px solid #E5E7EB;
            text-align: left;
        }

        .tabel th {
            background: #F9FAFB;
            font-weight: 600;
        }

        .nav-bawah {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            padding: 0.7rem 0;
            z-index: 99;
        }

        .nav-item {
            text-align: center;
            color: var(--abu);
            font-size: 0.85rem;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.aktif {
            color: var(--utama);
            font-weight: 500;
        }

        .nav-item i {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 0.2rem;
        }

        .halaman {
            display: none;
        }

        .halaman.aktif {
            display: block;
        }

        .kosong {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--abu);
        }

        .kosong i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Tambahan gaya untuk halaman pengguna */
        .tabel-pengguna {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .tabel-pengguna th, .tabel-pengguna td {
            padding: 0.8rem;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }
        .tabel-pengguna th {
            background: #f3f4f6;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="judulHalaman">Panel Admin</h1>
</div>

<div class="container">
    <!-- Halaman Dashboard -->
    <div class="halaman aktif" id="halaman-dashboard">
        <div class="card">
            <h5><i class="bi bi-speedometer2 text-primary"></i> Ringkasan Data</h5>
            <p>Selamat datang di panel admin. Gunakan menu di bawah untuk mengelola data.</p>
        </div>
    </div>

    <!-- Halaman Kelola Banner -->
    <div class="halaman" id="halaman-banner">
        <div class="card">
            <h5><i class="bi bi-image text-success"></i> Kelola Banner</h5>
            <div class="form-group">
                <label>Link Gambar Banner</label>
                <input type="text" id="linkBanner" placeholder="Masukkan URL gambar">
            </div>
            <button class="btn btn-hijau w-100" onclick="simpanBanner()">Simpan Banner</button>
            <div id="daftarBanner"></div>
        </div>
    </div>

    <!-- Halaman Kelola Kategori -->
    <div class="halaman" id="halaman-kategori">
        <div class="card">
            <h5><i class="bi bi-list text-warning"></i> Kelola Kategori</h5>
            <div class="form-group">
                <label>Nama Kategori</label>
                <input type="text" id="namaKategori" placeholder="Contoh: Makanan Berat">
            </div>
            <button class="btn btn-hijau w-100" onclick="tambahKategori()">Tambah Kategori</button>
            <div id="daftarKategori"></div>
        </div>
    </div>

    <!-- Halaman Kelola Menu -->
    <div class="halaman" id="halaman-menu">
        <div class="card">
            <h5><i class="bi bi-egg-fried text-danger"></i> Kelola Menu Makanan</h5>
            <div class="form-group">
                <label>Pilih Kategori</label>
                <select id="kategoriMenu"></select>
            </div>
            <div class="form-group">
                <label>Nama Makanan</label>
                <input type="text" id="namaMenu" placeholder="Contoh: Nasi Goreng">
            </div>
            <div class="form-group">
                <label>Harga (Rp)</label>
                <input type="number" id="hargaMenu" placeholder="Contoh: 15000">
            </div>
            <div class="form-group">
                <label>Link Gambar</label>
                <input type="text" id="gambarMenu" placeholder="URL gambar makanan">
            </div>
            <button class="btn btn-hijau w-100" onclick="tambahMenu()">Tambah Menu</button>
            <div id="daftarMenu"></div>
        </div>
    </div>

    <!-- Halaman Daftar Pesanan -->
    <div class="halaman" id="halaman-pesanan">
        <div class="card">
            <h5><i class="bi bi-receipt-cutoff text-info"></i> Daftar Pesanan Masuk</h5>
            <div id="daftarPesanan"></div>
        </div>
    </div>

    <!-- ✅ HALAMAN BARU: Kelola Pengguna -->
    <div class="halaman" id="halaman-pengguna">
        <div class="card">
            <h5><i class="bi bi-people text-primary"></i> Daftar Pengguna Terdaftar</h5>
            <div id="daftarPengguna"></div>
        </div>
    </div>
</div>

<!-- Navigasi Bawah -->
<div class="nav-bawah">
    <div class="nav-item aktif" onclick="bukaHalaman('dashboard')">
        <i class="bi bi-house"></i>
        <span>Dasbor</span>
    </div>
    <div class="nav-item" onclick="bukaHalaman('banner')">
        <i class="bi bi-image"></i>
        <span>Banner</span>
    </div>
    <div class="nav-item" onclick="bukaHalaman('kategori')">
        <i class="bi bi-list"></i>
        <span>Kategori</span>
    </div>
    <div class="nav-item" onclick="bukaHalaman('menu')">
        <i class="bi bi-egg-fried"></i>
        <span>Menu</span>
    </div>
    <div class="nav-item" onclick="bukaHalaman('pesanan')">
        <i class="bi bi-receipt"></i>
        <span>Pesanan</span>
    </div>
    <!-- ✅ MENU BARU: Pengguna -->
    <div class="nav-item" onclick="bukaHalaman('pengguna')">
        <i class="bi bi-people"></i>
        <span>Pengguna</span>
    </div>
</div>

<script>
// Fungsi navigasi
function bukaHalaman(nama) {
    document.querySelectorAll('.halaman').forEach(h => h.classList.remove('aktif'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('aktif'));

    if (nama === 'dashboard') {
        document.getElementById('halaman-dashboard').classList.add('aktif');
        document.querySelector('.nav-item:nth-child(1)').classList.add('aktif');
        document.getElementById('judulHalaman').textContent = 'Dasbor Admin';
    } else if (nama === 'banner') {
        document.getElementById('halaman-banner').classList.add('aktif');
        document.querySelector('.nav-item:nth-child(2)').classList.add('aktif');
        document.getElementById('judulHalaman').textContent = 'Kelola Banner';
        tampilkanBanner();
    } else if (nama === 'kategori') {
        document.getElementById('halaman-kategori').classList.add('aktif');
        document.querySelector('.nav-item:nth-child(3)').classList.add('aktif');
        document.getElementById('judulHalaman').textContent = 'Kelola Kategori';
        tampilkanKategori();
    } else if (nama === 'menu') {
        document.getElementById('halaman-menu').classList.add('aktif');
        document.querySelector('.nav-item:nth-child(4)').classList.add('aktif');
        document.getElementById('judulHalaman').textContent = 'Kelola Menu';
        isiPilihanKategori();
        tampilkanMenu();
    } else if (nama === 'pesanan') {
        document.getElementById('halaman-pesanan').classList.add('aktif');
        document.querySelector('.nav-item:nth-child(5)').classList.add('aktif');
        document.getElementById('judulHalaman').textContent = 'Daftar Pesanan';
        tampilkanPesanan();
    }
    // ✅ HALAMAN BARU: Pengguna
    else if (nama === 'pengguna') {
        document.getElementById('halaman-pengguna').classList.add('aktif');
        document.querySelector('.nav-item:nth-child(6)').classList.add('aktif');
        document.getElementById('judulHalaman').textContent = 'Kelola Pengguna';
        tampilkanDaftarPengguna();
    }
}

// Fungsi Banner
function simpanBanner() {
    const link = document.getElementById('linkBanner').value.trim();
    if (!link) return alert('Masukkan link gambar!');
    localStorage.setItem('DAFTAR_BANNER', JSON.stringify([{ link }]));
    alert('Banner disimpan!');
    tampilkanBanner();
    document.getElementById('linkBanner').value = '';
}

function tampilkanBanner() {
    const wadah = document.getElementById('daftarBanner');
    const data = JSON.parse(localStorage.getItem('DAFTAR_BANNER')) || [];
    if (data.length === 0) {
        wadah.innerHTML = '<p class="mt-3 text-muted">Belum ada banner</p>';
        return;
    }
    wadah.innerHTML = `<div class="mt-3"><img src="${data[0].link}" alt="Banner" style="width:100%; border-radius:8px;"></div>`;
}

// Fungsi Kategori
function tambahKategori() {
    const nama = document.getElementById('namaKategori').value.trim();
    if (!nama) return alert('Masukkan nama kategori!');
    const daftar = JSON.parse(localStorage.getItem('DAFTAR_KATEGORI')) || [];
    if (daftar.some(k => k.nama.toLowerCase() === nama.toLowerCase())) return alert('Kategori sudah ada!');
    daftar.push({ id: Date.now(), nama });
    localStorage.setItem('DAFTAR_KATEGORI', JSON.stringify(daftar));
    alert('Kategori ditambahkan!');
    tampilkanKategori();
    document.getElementById('namaKategori').value = '';
}

function tampilkanKategori() {
    const wadah = document.getElementById('daftarKategori');
    const daftar = JSON.parse(localStorage.getItem('DAFTAR_KATEGORI')) || [];
    if (daftar.length === 0) {
        wadah.innerHTML = '<p class="mt-3 text-muted">Belum ada kategori</p>';
        return;
    }
    wadah.innerHTML = `<table class="tabel mt-3">
        <tr><th>Nama Kategori</th><th>Aksi</th></tr>
        ${daftar.map(k => `<tr><td>${k.nama}</td><td><button class="btn btn-sm btn-merah" onclick="hapusKategori(${k.id})">Hapus</button></td></tr>`).join('')}
    </table>`;
}

function hapusKategori(id) {
    if (!confirm('Yakin hapus kategori ini?')) return;
    let daftar = JSON.parse(localStorage.getItem('DAFTAR_KATEGORI')) || [];
    daftar = daftar.filter(k => k.id !== id);
    localStorage.setItem('DAFTAR_KATEGORI', JSON.stringify(daftar));
    tampilkanKategori();
}

// Fungsi Menu
function isiPilihanKategori() {
    const pilih = document.getElementById('kategoriMenu');
    const daftar = JSON.parse(localStorage.getItem('DAFTAR_KATEGORI')) || [];
    pilih.innerHTML = daftar.map(k => `<option value="${k.id}">${k.nama}</option>`).join('');
}

function tambahMenu() {
    const idKategori = document.getElementById('kategoriMenu').value;
    const nama = document.getElementById('namaMenu').value.trim();
    const harga = document.getElementById('hargaMenu').value;
    const gambar = document.getElementById('gambarMenu').value.trim();
    if (!nama || !harga || !gambar) return alert('Lengkapi semua data!');
    const daftar = JSON.parse(localStorage.getItem('DAFTAR_MENU')) || [];
    daftar.push({ id: Date.now(), idKategori, nama, harga, gambar });
    localStorage.setItem('DAFTAR_MENU', JSON.stringify(daftar));
    alert('Menu ditambahkan!');
    tampilkanMenu();
    document.getElementById('namaMenu').value = '';
    document.getElementById('hargaMenu').value = '';
    document.getElementById('gambarMenu').value = '';
}

function tampilkanMenu() {
    const wadah = document.getElementById('daftarMenu');
    const daftar = JSON.parse(localStorage.getItem('DAFTAR_MENU')) || [];
    const kategori = JSON.parse(localStorage.getItem('DAFTAR_KATEGORI')) || [];
    if (daftar.length === 0) {
        wadah.innerHTML = '<p class="mt-3 text-muted">Belum ada menu</p>';
        return;
    }
    wadah.innerHTML = `<table class="tabel mt-3">
        <tr><th>Nama</th><th>Kategori</th><th>Harga</th><th>Aksi</th></tr>
        ${daftar.map(m => {
            const namaKat = kategori.find(k => k.id == m.idKategori)?.nama || '-';
            return `<tr><td>${m.nama}</td><td>${namaKat}</td><td>Rp ${Number(m.harga).toLocaleString('id-ID')}</td><td><button class="btn btn-sm btn-merah" onclick="hapusMenu(${m.id})">Hapus</button></td></tr>`;
        }).join('')}
    </table>`;
}

function hapusMenu(id) {
    if (!confirm('Yakin hapus menu ini?')) return;
    let daftar = JSON.parse(localStorage.getItem('DAFTAR_MENU')) || [];
    daftar = daftar.filter(m => m.id !== id);
    localStorage.setItem('DAFTAR_MENU', JSON.stringify(daftar));
    tampilkanMenu();
}

// Fungsi Pesanan
function tampilkanPesanan() {
    const wadah = document.getElementById('daftarPesanan');
    const daftar = JSON.parse(localStorage.getItem('PESANAN_AKTIF')) || [];
    if (daftar.length === 0) {
        wadah.innerHTML = '<div class="kosong"><i class="bi bi-receipt"></i><p>Belum ada pesanan masuk</p></div>';
        return;
    }
    wadah.innerHTML = daftar.map(p => `
        <div class="card mb-3 p-3 border">
            <p><strong>Resi:</strong> ${p.resi}</p>
            <p><strong>Pelanggan:</strong> ${p.nama} | ${p.hp}</p>
            <p><strong>Pesanan:</strong> ${p.barang}</p>
            <p><strong>Alamat:</strong> ${p.alamat}</p>
            <p><strong>Posisi:</strong> ${p.lat}, ${p.lon} (Akurasi: ${p.akurasi.toFixed(1)} m)</p>
            <p><strong>Status:</strong> 
                <select onchange="ubahStatus('${p.resi}', this.value)">
                    <option value="Menunggu" ${p.status === 'Menunggu' ? 'selected' : ''}>Menunggu</option>
                    <option value="Sudah Diambil" ${p.status === 'Sudah Diambil' ? 'selected' : ''}>Sudah Diambil</option>
                    <option value="Sampai di Restoran" ${p.status === 'Sampai di Restoran' ? 'selected' : ''}>Sampai di Restoran</option>
                    <option value="Dalam Perjalanan" ${p.status === 'Dalam Perjalanan' ? 'selected' : ''}>Dalam Perjalanan</option>
                    <option value="Selesai" ${p.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                </select>
            </p>
        </div>
    `).join('');
}

function ubahStatus(resi, statusBaru) {
    const daftar = JSON.parse(localStorage.getItem('PESANAN_AKTIF')) || [];
    const indeks = daftar.findIndex(p => p.resi === resi);
    if (indeks !== -1) {
        daftar[indeks].status = statusBaru;
        localStorage.setItem('PESANAN_AKTIF', JSON.stringify(daftar));
        tampilkanPesanan();
    }
}

// ✅ FUNGSI BARU: Kelola Pengguna
function tampilkanDaftarPengguna() {
    const wadah = document.getElementById('daftarPengguna');
    const daftar = JSON.parse(localStorage.getItem('DAFTAR_PENGGUNA')) || [];
    
    if (daftar.length === 0) {
        wadah.innerHTML = `<div class="kosong"><i class="bi bi-person-x"></i><p>Belum ada pengguna yang mendaftar</p></div>`;
        return;
    }

    wadah.innerHTML = `
    <table class="tabel-pengguna">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Lengkap</th>
                <th>Nomor HP</th>
                <th>Waktu Daftar</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            ${daftar.map((p, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${p.nama}</td>
                <td>${p.hp}</td>
                <td>${p.waktuDaftar || '-'}</td>
                <td><button class="btn btn-sm btn-merah" onclick="hapusPengguna('${p.hp}')">Hapus</button></td>
            </tr>
            `).join('')}
        </tbody>
    </table>`;
}

function hapusPengguna(hp) {
    if (!confirm("Yakin ingin menghapus pengguna ini?")) return;
    let daftar = JSON.parse(localStorage.getItem('DAFTAR_PENGGUNA')) || [];
    daftar = daftar.filter(p => p.hp !== hp);
    localStorage.setItem('DAFTAR_PENGGUNA', JSON.stringify(daftar));
    tampilkanDaftarPengguna();
}

// Muat data awal
window.onload = function() {
    tampilkanBanner();
    tampilkanKategori();
    tampilkanMenu();
    tampilkanPesanan();
};
</script>

</body>
</html>
